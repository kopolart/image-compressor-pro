<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Image Compressor and Resizer Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="55%" stop-color="#0e1c33"/>
      <stop offset="100%" stop-color="#082b30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173654"/>
      <stop offset="100%" stop-color="#0c2135"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <circle cx="1130" cy="50" r="190" fill="#38bdf8" opacity="0.12" filter="url(#soft)"/>
  <circle cx="200" cy="330" r="180" fill="#34d399" opacity="0.10" filter="url(#soft)"/>
  <path d="M0 306 H1280" stroke="#1e3a56" stroke-width="1" opacity="0.7"/>
  <path d="M0 306 H420" stroke="url(#accent)" stroke-width="2" opacity="0.9"/>

  <!-- App mark: crop brackets around a compression arrow -->
  <g transform="translate(88,84)">
    <rect width="172" height="172" rx="40" fill="url(#tile)" stroke="#24486a" stroke-width="2"/>
    <g fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
      <path d="M42 70 V50 Q42 42 50 42 H70"/>
      <path d="M102 42 H122 Q130 42 130 50 V70"/>
      <path d="M42 102 V122 Q42 130 50 130 H70"/>
      <path d="M102 130 H122 Q130 130 130 122 V102"/>
    </g>
    <g stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M86 58 V98"/>
      <path d="M69 84 L86 102 L103 84"/>
    </g>
  </g>

  <text x="302" y="152" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.2" fill="#f1f5f9">Image Compressor &amp; Resizer Pro</text>
  <text x="304" y="202" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Resize, compress and convert images &#8212; fast, private and 100% offline on Windows.</text>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
    <g fill="#12263a" stroke="#24486a">
      <rect x="304" y="234" width="62" height="34" rx="17"/>
      <rect x="376" y="234" width="54" height="34" rx="17"/>
      <rect x="440" y="234" width="66" height="34" rx="17"/>
      <rect x="516" y="234" width="56" height="34" rx="17"/>
      <rect x="582" y="234" width="50" height="34" rx="17"/>
      <rect x="642" y="234" width="52" height="34" rx="17"/>
    </g>
    <text x="335" y="256" text-anchor="middle">JPEG</text>
    <text x="403" y="256" text-anchor="middle">PNG</text>
    <text x="473" y="256" text-anchor="middle">WebP</text>
    <text x="544" y="256" text-anchor="middle">BMP</text>
    <text x="607" y="256" text-anchor="middle">GIF</text>
    <text x="668" y="256" text-anchor="middle">TIFF</text>
    <rect x="718" y="234" width="156" height="34" rx="17" fill="#0f2f2b" stroke="#1f6f5c"/>
    <circle cx="738" cy="251" r="5" fill="#34d399"/>
    <text x="752" y="256" fill="#a7f3d0">100% offline</text>
  </g>
</svg>

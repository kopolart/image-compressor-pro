name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish ImageCompression/ImageCompression.csproj -c Release -o dist

      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md -Destination dist
          $zip = "image-compressor-pro-${{ github.ref_name }}-win-anycpu.zip"
          Compress-Archive -Path "dist\*" -DestinationPath $zip
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "$env:RELEASE_ZIP"
          --title "Image Compressor & Resizer Pro ${{ github.ref_name }}"
          --generate-notes
